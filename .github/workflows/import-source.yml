name: Import approved Android TV source

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Current main commit reviewed before import
        required: true
        type: string
      expected_tree:
        description: Expected imported Git tree
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA256: 3c0c36b58093ce26b71ec994de8cdaf2bac24569bd0be0a9a3af588ac3b02d6f
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Verify reviewed repository head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Download the approved draft source archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          source_asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft and .tag_name == "v1.8.40") | .assets[] | select(.name == "Noiro-1.8.40-source.zip") | .id')"
          [[ "$source_asset_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$source_asset_id" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/noiro-source.zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/noiro-source.zip" | sha256sum -c -
      - name: Extract source without changing workflow permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os, stat, zipfile
          root = Path(os.environ['GITHUB_WORKSPACE'])
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'noiro-source.zip') as archive:
              entries = archive.infolist()
              assert len(entries) == 271
              assert sum(item.file_size for item in entries) < 8 * 1024 * 1024
              names = set()
              for item in entries:
                  path = PurePosixPath(item.filename)
                  assert not path.is_absolute() and not any(part in ('..', '.git') for part in path.parts)
                  assert item.filename not in names
                  names.add(item.filename)
                  mode = item.external_attr >> 16
                  assert not stat.S_ISLNK(mode)
                  assert path.suffix.lower() not in ('.apk', '.keystore', '.jks', '.p12', '.pfx')
                  assert path.name not in ('config.properties', 'local.properties')
                  # Workflows are installed through the owner's GitHub UI, not this token.
                  if path.parts[0] == '.github':
                      continue
                  target = root.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
                  target.chmod(0o755 if mode & 0o111 else 0o644)
          PY
      - name: Verify exact tree and publish source
        shell: bash
        run: |
          git config core.autocrlf false
          git config user.name 'Noiro Media'
          git config user.email '359125148+NoiroMedia@users.noreply.github.com'
          git add --all
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git commit -m 'Publish Noiro Android TV 1.8.40 source'
          git push origin HEAD:main
