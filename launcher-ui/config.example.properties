# Noiro's non-secret defaults. A clean checkout builds without creating config.properties.
# Optionally copy this file to config.properties for local display defaults.
# Do not put credentials here. Browsing uses public metadata without a key;
# optional personal TMDB credentials are configured in the app's Settings.

# Two-letter country code for regional Where to Watch information.
tmdb_region=US

# English is the initial language. Existing in-app language choices remain available.
# Supported values: en, es, pt, ru, de, tr, auto.
language=en

# Legacy shared-code defaults. These do not enable launcher-only widgets or controls.
latitude=40.7128
longitude=-74.0060
city=
currency=USD
temperature=auto
